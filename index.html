<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ten Days</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ten Days">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#07080D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EFF1F7" media="(prefers-color-scheme: light)">
<style>
/* Ten Days look: dark by default, soft teal glow, warm red for the check-in button, glass cards.
   Every color is a token, so the light theme only swaps tokens. */
:root {
  --bg: #07080D; --glow-a: rgba(110, 140, 255, .17); --glow-b: rgba(214, 72, 50, .07); --glow-c: rgba(95, 214, 182, .13);
  --glass-hi: rgba(255, 255, 255, .075); --glass-lo: rgba(255, 255, 255, .028); --glass-solid: #13151D;
  --line: rgba(255, 255, 255, .11); --field: rgba(255, 255, 255, .05);
  --ink: #EEF1F8; --muted: #A8AFC2;
  --corner: #5FD6B6; --corner-2: #3FBF9C; --corner-ink: #04211A; --corner-soft: rgba(127, 178, 255, .13); --corner-glow: rgba(127, 178, 255, .28);
  --prim-grad: linear-gradient(120deg, #6EE7C8, #7FB2FF 55%, #C29BFF); --prim-ink: #0A0B14; --prim-glow: rgba(127, 178, 255, .30);
  --gem-empty: rgba(255, 255, 255, .045); --gem-line: rgba(255, 255, 255, .30); --gem-glow: rgba(130, 150, 255, .38);
  --ok-text: #7FE3C7; --bad-text: #FF9A8A; --warn-text: #F2C76E; --warn-soft: rgba(242, 199, 110, .10);
  --pr-high: #FF8A7A;
  --ty-read: #F2C76E; --ty-call: #7FE3C7; --ty-meeting: #8FBAFF; --ty-errand: #FF9AC8; --ty-custom: #C9A6FF;
  --red-1: #D2402D; --red-2: #A62E1F; --signal-ink: #FFFFFF; --signal-soft: rgba(255, 110, 90, .13); --signal-line: rgba(255, 130, 110, .5);
  --red-glow: rgba(210, 64, 45, .42); --red-glow-hi: rgba(210, 64, 45, .62);
  --orb-1: rgba(110, 230, 198, .30); --orb-2: rgba(80, 210, 175, .16); --orb-3: rgba(80, 210, 175, 0);
  --orb-shine: rgba(150, 250, 222, .18); --orb-halo: rgba(95, 214, 182, .30);
  --bar-bg: rgba(7, 8, 13, .80); --shadow: rgba(0, 0, 0, .38); --hx: 0;
  --bar: 104px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #EFF1F7; --glow-a: rgba(90, 110, 230, .14); --glow-b: rgba(214, 72, 50, .05); --glow-c: rgba(30, 150, 120, .12);
    --glass-hi: rgba(255, 255, 255, .90); --glass-lo: rgba(255, 255, 255, .68); --glass-solid: #FFFFFF;
    --line: rgba(20, 28, 60, .13); --field: rgba(255, 255, 255, .8);
    --ink: #11141F; --muted: #4D5466;
    --corner: #12806A; --corner-2: #0D6855; --corner-ink: #FFFFFF; --corner-soft: rgba(53, 89, 199, .10); --corner-glow: rgba(53, 89, 199, .22);
    --prim-grad: linear-gradient(120deg, #0F7A64, #3559C7 55%, #7A4BD6); --prim-ink: #FFFFFF; --prim-glow: rgba(53, 89, 199, .26);
    --gem-empty: rgba(20, 30, 70, .06); --gem-line: rgba(255, 255, 255, .55); --gem-glow: rgba(80, 100, 220, .24);
    --ok-text: #0B5E4D; --bad-text: #B3301D; --warn-text: #7A520B; --warn-soft: rgba(160, 110, 20, .10);
    --pr-high: #C8402C;
    --ty-read: #8A5A00; --ty-call: #0B6B57; --ty-meeting: #2F55C0; --ty-errand: #B02D72; --ty-custom: #6B3FC6;
    --signal-soft: rgba(201, 58, 40, .08); --signal-line: rgba(201, 58, 40, .45);
    --red-glow: rgba(201, 58, 40, .28); --red-glow-hi: rgba(201, 58, 40, .42);
    --orb-1: rgba(40, 170, 140, .22); --orb-2: rgba(40, 170, 140, .10); --orb-3: rgba(40, 170, 140, 0);
    --orb-shine: rgba(255, 255, 255, .5); --orb-halo: rgba(18, 128, 106, .18);
    --bar-bg: rgba(239, 241, 247, .84); --shadow: rgba(20, 28, 60, .12);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
html, body { margin: 0; color: var(--ink); }
/* Body text follows the iPhone Text Size setting through -apple-system-body; everything else is sized in em from it. */
body {
  min-height: 100vh;
  background: radial-gradient(80% 50% at 12% -10%, var(--glow-a), transparent 70%), radial-gradient(70% 45% at 96% 2%, var(--glow-c), transparent 70%), radial-gradient(70% 40% at 50% 112%, var(--glow-b), transparent 70%), var(--bg);
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
@supports (font: -apple-system-body) {
  body { font: -apple-system-body; line-height: 1.45; font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; }
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--corner); outline-offset: 3px; }
[hidden] { display: none !important; }

.screen { position: relative; max-width: 540px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 1.1em;
  padding-top: calc(1.4em + env(safe-area-inset-top, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 1.2em); }
#screen.enter { animation: screenin 180ms ease-out both; }
@keyframes screenin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

h1 { font-size: 2em; line-height: 1.1; margin: 0; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
h1:focus { outline: none; }
p { margin: 0; }
.sub { color: var(--muted); }
.small { font-size: .85em; color: var(--muted); }
.lbl { font-size: .85em; font-weight: 650; color: var(--muted); letter-spacing: .01em; }
.push { margin-top: auto; }
.group { display: flex; flex-direction: column; gap: .8em; }

/* glass surfaces, with a solid fallback where blur isn't supported */
.card, .btn, .chip, code, .cancelbar, .toast {
  -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
}
.card { background: linear-gradient(180deg, var(--glass-hi), var(--glass-lo)); border: 1px solid var(--line); border-radius: 24px; padding: 1.15em 1.2em;
  display: flex; flex-direction: column; gap: .8em; min-width: 0; box-shadow: 0 14px 34px var(--shadow); }
.card.warn { background: linear-gradient(180deg, var(--warn-soft), var(--glass-lo)); border-color: var(--warn-text); }
.card.bad { background: linear-gradient(180deg, var(--signal-soft), var(--glass-lo)); border-color: var(--signal-line); }
.card.ok { background: linear-gradient(180deg, var(--corner-soft), var(--glass-lo)); border-color: var(--corner); }
.status { font-weight: 700; }
.status.ok { color: var(--ok-text); }
.status.bad { color: var(--bad-text); }

.btn { min-height: 48px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--glass-hi), var(--glass-lo)); color: var(--ink);
  padding: .7em 1.1em; border-radius: 18px; font-weight: 650; text-decoration: none; display: flex; align-items: center; justify-content: center;
  text-align: center; width: 100%; transition: transform 120ms ease, filter 120ms ease; }
.btn.primary, .btn.corner { min-height: 56px; background: var(--prim-grad); color: var(--prim-ink);
  border-color: transparent; font-size: 1.05em; font-weight: 750; box-shadow: 0 10px 26px var(--prim-glow); }
.btn.danger { background: linear-gradient(180deg, var(--red-1), var(--red-2)); color: var(--signal-ink); border-color: transparent; }
.btn.link { background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; text-decoration: underline; text-underline-offset: 3px;
  min-height: 44px; width: auto; align-self: center; color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn .hint { display: block; font-weight: 400; font-size: .85em; color: var(--muted); }
.morelist .btn { justify-content: space-between; text-align: left; flex-direction: column; align-items: flex-start; border-radius: 20px; padding: .85em 1.15em; }
.row { display: flex; gap: .6em; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1; width: auto; }
.chip { min-height: 48px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--glass-hi), var(--glass-lo)); padding: .45em 1.1em; border-radius: 99px; font-weight: 650;
  transition: transform 120ms ease, filter 120ms ease; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:active:not(:disabled), .chip:active, .sos:active { transform: scale(.97); filter: brightness(1.12); }

.field { display: flex; flex-direction: column; gap: .35em; min-width: 0; }
input[type=text], input[type=tel], input[type=date], input[type=time], input[type=url], input[type=password], select, textarea { width: 100%; min-width: 0; min-height: 48px; border: 1px solid var(--line); background: var(--field); border-radius: 16px; padding: .65em .9em; }
textarea { min-height: 6em; resize: vertical; }
.toggle { display: flex; gap: .8em; align-items: flex-start; min-height: 48px; }
.toggle input { width: 26px; height: 26px; margin-top: .1em; accent-color: var(--corner); flex: none; }
code { font: .85em ui-monospace, Menlo, Consolas, monospace; background: var(--field); border: 1px solid var(--line); border-radius: 14px; padding: .7em .9em;
  word-break: break-all; display: block; -webkit-user-select: all; user-select: all; }
ol, ul { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: .55em; }

/* breath: a glowing orb that grows, a thin progress ring, the countdown */
@property --p { syntax: "<number>"; inherits: false; initial-value: 0; }
.breath { align-self: center; position: relative; width: min(72vw, 280px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; margin: .4em 0; }
.breath::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--line); }
.breath::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--corner) calc(var(--p) * 1turn), transparent 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
  animation: ring var(--bdur, 10s) linear var(--bdelay, 0s) both; }
@keyframes ring { from { --p: 0; } to { --p: 1; } }
.breath .fill { position: absolute; inset: 7%; border-radius: 50%;
  background: radial-gradient(circle at 50% 36%, var(--orb-shine), transparent 30%), radial-gradient(circle, var(--orb-1), var(--orb-2) 55%, var(--orb-3) 72%);
  box-shadow: 0 0 60px var(--orb-halo), inset 0 0 40px var(--orb-halo);
  transform: scale(.35); animation: breathfill 10s linear forwards; }
@keyframes breathfill { from { transform: scale(.35); opacity: .75; } to { transform: scale(1); opacity: 1; } }
.breath .count { position: relative; font-size: 3.4em; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

.logrow { display: flex; flex-direction: column; gap: .4em; padding: .85em 0; border-bottom: 1px solid var(--line); }
.logrow:last-child { border-bottom: 0; }

/* fixed SOS bar, above the home indicator */
.sosbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bar-bg); border-top: 1px solid var(--line);
  -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sosbar > * { max-width: 540px; margin: 0 auto; }
.sos { position: relative; z-index: 0; width: 100%; min-height: 72px; border: 0; border-radius: 22px; color: var(--signal-ink); background: linear-gradient(180deg, var(--red-1), var(--red-2));
  /* capped so the bar stays under a third of a small screen at the largest Text Size */
  font-size: min(1.5em, 36px); font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 8px 22px var(--red-glow);
  transition: transform 120ms ease, filter 120ms ease;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
/* the glow is its own layer and only its opacity animates, which is cheap to draw */
.sos::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
  box-shadow: 0 10px 36px var(--red-glow-hi); opacity: .45; animation: sosglow 3.6s ease-in-out infinite alternate; }
@keyframes sosglow { from { opacity: .45; } to { opacity: 1; } }
.cancelbar { display: flex; gap: .75em; align-items: center; min-height: 72px; background: linear-gradient(180deg, var(--signal-soft), var(--glass-lo));
  border: 1px solid var(--signal-line); border-radius: 22px; padding: .5em .75em; }
.cancelbar b { flex: 1; font-size: min(1.15em, 26px); font-weight: 800; }
.cancelbar .btn { width: auto; min-width: 110px; min-height: 56px; font-size: min(1em, 24px); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 40;
  background: var(--ink); color: var(--bg); padding: .65em 1.1em; border-radius: 16px; font-weight: 650; max-width: calc(100% - 32px); box-shadow: 0 10px 30px var(--shadow); }

/* ============ home: gem, today list, quick add ============ */
.topmore { position: absolute; top: calc(1.15em + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; border: 1px solid var(--line); background: linear-gradient(180deg, var(--glass-hi), var(--glass-lo)); color: var(--ink); padding: 0; }
/* any inline icon without its own rule stays text-sized */
:where(p, span, h2, h3, li, label, a) > svg { width: 1.15em; height: 1.15em; vertical-align: -.18em; flex: none; }
.topmore svg { width: 22px; height: 22px; }
#screen[data-screen="home"] h1 { font-size: 1.6em; padding-right: 2.6em; min-height: 48px; display: flex; align-items: center; }
.eyebrow { order: -1; margin-bottom: -.9em; font-size: .78em; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pill { align-self: flex-start; font-size: .85em; font-weight: 650; color: var(--muted); padding: .35em .9em; border-radius: 99px; border: 1px solid var(--line); background: var(--field); }
.hero { display: grid; grid-template-columns: minmax(118px, 40%) 1fr; gap: .9em; align-items: center; padding: 1em 1.1em 1.05em .8em; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: auto -20% -60% 20%; height: 120%; background: radial-gradient(closest-side, var(--gem-glow), transparent); opacity: .35; pointer-events: none; }
.gem { width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 10px 26px var(--gem-glow)); }
.gem .trk { fill: none; stroke: var(--line); stroke-width: 3; }
.gem .arc { fill: none; stroke-width: 3.5; stroke-linecap: round; }
.gem .body { fill: var(--gem-empty); }
.gem .facet { fill: none; stroke: var(--gem-line); stroke-width: 1.1; stroke-linejoin: round; }
.gem-level { transition: transform 1.1s cubic-bezier(.2, .8, .2, 1); }
.gem-wave { animation: gemwave 3.4s linear infinite; }
@keyframes gemwave { from { transform: translateX(0); } to { transform: translateX(-50px); } }
.gem-shine { animation: gemshine 6s ease-in-out infinite; }
@keyframes gemshine { 0%, 60% { transform: translateX(-150px); } 100% { transform: translateX(170px); } }
.gem-spark { opacity: 0; fill: #FFFFFF; transform-box: fill-box; transform-origin: center; }
.gem.full .gem-spark { animation: twinkle 2.6s ease-in-out infinite; }
.gem.full .gem-spark.s2 { animation-delay: .9s; }
.gem.full .gem-spark.s3 { animation-delay: 1.7s; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3); } 50% { opacity: 1; transform: scale(1); } }
.gem.burst { animation: gemburst 900ms cubic-bezier(.2, .9, .3, 1.3); }
@keyframes gemburst { 0% { transform: scale(1); } 40% { transform: scale(1.12) rotate(-4deg); } 100% { transform: scale(1); } }
.stats { display: flex; flex-direction: column; gap: .25em; min-width: 0; position: relative; z-index: 1; }
.big { font-size: 2.7em; font-weight: 800; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.big .of { color: var(--muted); font-size: .5em; font-weight: 750; letter-spacing: 0; }
.gradtext { background: var(--prim-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.statline { display: flex; flex-wrap: wrap; gap: .25em .7em; font-size: .8em; font-weight: 700; color: var(--muted); }
.statline svg { width: 1.05em; height: 1.05em; vertical-align: -.15em; margin-right: .15em; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: .45em; }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .68em; font-weight: 750; color: var(--muted); }
.week .bar { width: 100%; max-width: 16px; height: 30px; border-radius: 6px; background: var(--field); border: 1px solid var(--line); position: relative; overflow: hidden; }
.week .bar i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--prim-grad); }
.week .d.now { color: var(--ink); }
.week .d.now .bar { border-color: var(--ink); }

.sect { display: flex; align-items: center; justify-content: space-between; gap: .5em; margin-top: .2em; }
.sect h2 { margin: 0; font-size: 1.25em; font-weight: 800; letter-spacing: -.015em; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 99px; background: var(--field); border: 1px solid var(--line); }
.seg button { min-height: 44px; border: 0; border-radius: 99px; background: none; font-weight: 750; color: var(--muted); padding: 0 .4em; transition: background 160ms ease, color 160ms ease; }
.seg button[aria-pressed="true"] { background: var(--glass-solid); color: var(--ink); box-shadow: 0 4px 14px var(--shadow); }
.seg .n { margin-left: .3em; font-size: .78em; padding: .05em .5em; border-radius: 99px; background: var(--corner-soft); color: var(--ink); }

.qa { display: flex; gap: .5em; align-items: center; padding: .3em .3em .3em 1em; border-radius: 22px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--glass-hi), var(--glass-lo)); }
.qa:focus-within { border-color: var(--corner); box-shadow: 0 0 0 3px var(--corner-soft); }
.qa input[type=text] { border: 0; background: none; padding: 0; flex: 1; border-radius: 0; }
.qa input[type=text]:focus-visible { outline: none; }
.qa .add { width: 48px; height: 48px; flex: none; border-radius: 17px; border: 0; background: var(--prim-grad); color: var(--prim-ink); display: grid; place-items: center; padding: 0; box-shadow: 0 6px 18px var(--prim-glow); }
.qa .add svg { width: 22px; height: 22px; }
.qa-prev { display: flex; flex-wrap: wrap; gap: .35em; margin-top: -.5em; }
.qa-prev:empty { display: none; }
.tag { font-size: .78em; font-weight: 700; padding: .22em .7em; border-radius: 99px; background: var(--corner-soft); color: var(--ink); border: 1px solid var(--line); }
.tag.hi { color: var(--pr-high); }

.tlist { display: flex; flex-direction: column; gap: .5em; }
.dayhead { font-size: .8em; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: .5em 0 -.1em .3em; }
.trow { display: flex; align-items: center; gap: .6em; padding: .35em .55em .35em .45em; border-radius: 20px; border: 1px solid var(--line);
  background: linear-gradient(180deg, var(--glass-hi), var(--glass-lo)); position: relative; overflow: hidden; }
#screen.enter .trow { animation: rowin 280ms ease-out both; }
@keyframes rowin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.trow::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: transparent; }
.trow.pr-high::before { background: var(--pr-high); }
.check { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--field); display: grid; place-items: center; color: transparent; padding: 0;
  transition: transform 140ms ease, background 200ms ease; }
.check svg { width: 22px; height: 22px; }
.check[aria-pressed="true"] { background: var(--prim-grad); border-color: transparent; color: var(--prim-ink); }
.check:active { transform: scale(.86); }
.trow.over .check { border-color: var(--bad-text); }
.trow.pop .check { animation: checkpop 420ms cubic-bezier(.2, .9, .3, 1.4); }
@keyframes checkpop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
.tdot { flex: none; width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); font-size: .8em; font-weight: 750; font-variant-numeric: tabular-nums; }
.tmain { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: .3em 0; min-height: 52px; display: flex; flex-direction: column; justify-content: center; gap: .12em; color: var(--ink); }
.ttitle { font-weight: 700; overflow-wrap: anywhere; }
.tmeta { font-size: .8em; color: var(--muted); display: flex; flex-wrap: wrap; gap: .15em .6em; align-items: center; }
.tmeta .ov { color: var(--bad-text); font-weight: 750; }
.tmeta .hot { color: var(--warn-text); font-weight: 750; }
.tmeta svg { width: 1em; height: 1em; vertical-align: -.14em; margin-right: .15em; }
.tico { flex: none; width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: var(--field); border: 1px solid var(--line); }
.tico svg { width: 18px; height: 18px; }
.ty-read { color: var(--ty-read); } .ty-call { color: var(--ty-call); } .ty-meeting { color: var(--ty-meeting); } .ty-errand { color: var(--ty-errand); } .ty-custom { color: var(--ty-custom); }
.trow.done .ttitle { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.trow.done, .trow.snz { opacity: .7; }
.empty { text-align: center; padding: 1.4em 1em; border: 1px dashed var(--line); border-radius: 20px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: .5em; }
.tile { min-height: 68px; border-radius: 20px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--glass-hi), var(--glass-lo)); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3em; font-weight: 700; font-size: .85em; padding: .5em; text-align: center; }
.tile svg { width: 22px; height: 22px; }
.stepcard { gap: .55em; padding: 1em 1.1em .5em; }
.stepcard .btn.primary { min-height: 50px; }
.stepcard .row.links { justify-content: flex-start; gap: 1.2em; margin-top: -.2em; }
.stepcard .lbl { display: flex; align-items: center; gap: .4em; }
.stepcard .lbl svg { width: 1.1em; height: 1.1em; }

/* task detail */
.badges { display: flex; flex-wrap: wrap; gap: .4em; }
.hist { display: grid; grid-template-columns: repeat(14, 1fr); gap: 5px; }
.hist.wk { grid-template-columns: repeat(8, 1fr); }
.hist i { aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--line); }
.hist i.on { background: var(--prim-grad); border-color: transparent; }
.hist i.off { opacity: .3; border-style: dashed; }
.prog { height: 8px; border-radius: 99px; background: var(--field); border: 1px solid var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--prim-grad); border-radius: inherit; transition: width 400ms ease; }
.inline { display: flex; gap: .5em; }
.inline input { flex: 1; }
.inline .btn { width: auto; flex: none; }
.dow { display: flex; flex-wrap: wrap; gap: .4em; }
.dow .chip { min-width: 52px; padding: .45em .6em; }

/* focus session */
.fring { align-self: center; width: min(74vw, 290px); position: relative; margin: .3em 0; }
.fring svg { width: 100%; height: auto; display: block; transform: rotate(-90deg); overflow: visible; }
.fring .trk { fill: none; stroke: var(--line); stroke-width: 5; }
.fring .arc { fill: none; stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 0 10px var(--gem-glow)); }
.fring .mid { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; text-align: center; gap: .2em; padding: 18%; }
.fring .time { font-size: 3.2em; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.03em; line-height: 1; }

/* hidden switch used only to trigger the iPhone haptic tick */
.hx { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }

/* ============ moods: planning (teal/blue), focus (indigo), support (dusk rose), growth (gold) ============ */
:root { --cf0: #6EE7C8; --cf1: #7FB2FF; --cf2: #F2C76E; --cf3: #FF9AC8; --care: #E9A6C8; --care-soft: rgba(233, 166, 200, .12); --gold: #F2C76E; --gold-soft: rgba(242, 199, 110, .12); }
body[data-mode="focus"] { --glow-a: rgba(140, 110, 255, .22); --glow-c: rgba(110, 140, 255, .14); --glow-b: rgba(120, 90, 220, .08); }
body[data-mode="support"] { --glow-a: rgba(255, 150, 175, .15); --glow-c: rgba(185, 150, 255, .17); --glow-b: rgba(255, 190, 140, .10); --corner: #E9A6C8; --corner-soft: rgba(233, 166, 200, .14); --orb-1: rgba(233, 166, 200, .32); --orb-2: rgba(185, 150, 255, .18); --orb-3: rgba(185, 150, 255, 0); --orb-halo: rgba(233, 166, 200, .30); }
body[data-mode="grow"] { --glow-a: rgba(242, 199, 110, .14); --glow-c: rgba(127, 178, 255, .13); }
@media (prefers-color-scheme: light) {
  :root { --care: #A23C72; --care-soft: rgba(162, 60, 114, .08); --gold: #8A5A00; --gold-soft: rgba(160, 110, 20, .10); }
  body[data-mode="focus"] { --glow-a: rgba(110, 80, 230, .14); --glow-c: rgba(80, 110, 230, .10); }
  body[data-mode="support"] { --glow-a: rgba(220, 110, 150, .12); --glow-c: rgba(140, 100, 230, .12); --corner: #A23C72; --corner-soft: rgba(162, 60, 114, .10); --orb-1: rgba(200, 90, 140, .22); --orb-2: rgba(140, 100, 230, .10); --orb-3: rgba(140, 100, 230, 0); --orb-halo: rgba(162, 60, 114, .18); }
  body[data-mode="grow"] { --glow-a: rgba(200, 150, 40, .12); }
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ============ dock: three tabs and the button ============ */
.dock { display: flex; gap: 10px; align-items: stretch; }
.tabs { display: flex; flex: 1.3; gap: 2px; min-width: 0; }
.tab { flex: 1; min-width: 0; min-height: 60px; border: 0; background: none; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: min(.72em, 15px); font-weight: 750; color: var(--muted); padding: 4px 2px; transition: background 160ms ease, color 160ms ease; }
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab svg { width: 24px; height: 24px; flex: none; }
.tab[aria-current="page"] { color: var(--ink); background: var(--field); box-shadow: inset 0 0 0 1px var(--line); }
.tab:active { transform: scale(.95); }
.dock .sos { flex: 1; width: auto; min-height: 60px; font-size: min(1.05em, 24px); padding: 4px 10px; line-height: 1.1; }

/* ============ the one box and its card ============ */
#screen[data-screen="home"] h1 { padding-right: 0; }
.qa input[type=text] { min-height: 48px; }
.btn.link.inl { min-height: 44px; padding: 0; display: inline; }
.asst { gap: .7em; animation: asstin 220ms cubic-bezier(.2, .8, .2, 1) both; border-color: var(--corner); }
.asst.k-overwhelm, .asst.k-encourage { border-color: var(--care); background: linear-gradient(180deg, var(--care-soft), var(--glass-lo)); }
.asst.k-review { border-color: var(--gold); background: linear-gradient(180deg, var(--gold-soft), var(--glass-lo)); }
@keyframes asstin { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
.state { display: inline-flex; align-items: center; gap: .4em; font-size: .78em; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0; }
.state svg { width: 1.15em; height: 1.15em; }
.state.saved, .state.on { color: var(--ok-text); }
.state.care { color: var(--care); }
.state:focus { outline: none; }
.ttl { font-weight: 750; font-size: 1.15em !important; border: 1px solid transparent !important; background: none !important; padding: .3em .5em !important; margin: -.2em -.5em; border-radius: 12px !important; min-height: 44px; }
.ttl:hover, .ttl:focus { border-color: var(--line) !important; background: var(--field) !important; }
.fchips { display: flex; flex-wrap: wrap; gap: .4em; }
.fchip { min-height: 44px; display: inline-flex; align-items: center; gap: .35em; padding: .3em .85em; border-radius: 99px; border: 1px solid var(--line); background: var(--field); font-weight: 650; font-size: .88em; color: var(--ink); transition: border-color 140ms ease, transform 120ms ease; }
.fchip svg { width: 1.1em; height: 1.1em; flex: none; }
.fchip.sug { border-style: dashed; border-color: var(--warn-text); }
.fchip .s { font-size: .82em; color: var(--warn-text); font-weight: 650; }
.fchip.miss { color: var(--muted); }
.fchip[aria-expanded="true"] { border-color: var(--corner); box-shadow: 0 0 0 2px var(--corner-soft); }
.fchip:active { transform: scale(.96); }
.editor { display: flex; flex-direction: column; gap: .7em; padding: .8em; border-radius: 18px; border: 1px solid var(--line); background: var(--field); }
.askq { display: flex; flex-direction: column; gap: .6em; padding: .85em .9em; border-radius: 18px; background: var(--corner-soft); border: 1px solid var(--line); }
.askq .qt { font-weight: 750; }
.row.links { gap: .4em 1em; }
.row.links > .btn.primary, .row.links > .btn:not(.link) { flex: 1 1 auto; }
.mini { display: flex; flex-direction: column; gap: .5em; padding: .8em .9em; border-radius: 18px; border: 1px solid var(--line); background: var(--field); }
.steps { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .5em; min-width: 0; }
.steps legend { padding: 0; margin-bottom: .4em; }
.pstep { display: flex; gap: .6em; align-items: flex-start; padding: .55em .6em; border-radius: 16px; border: 1px solid var(--line); background: var(--field); }
.pstep > input[type=checkbox] { width: 26px; height: 26px; margin-top: .7em; accent-color: var(--corner); flex: none; }
.pstep .pmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .4em; }
.pstep .pmain .row input { flex: 1; min-width: 0; width: auto; }
.pstep.off .pmain { opacity: .5; }
.quote { margin: 0; font-size: 1.22em; font-weight: 700; line-height: 1.35; letter-spacing: -.01em; text-wrap: pretty; }
.quote.sm { font-size: 1.05em; font-weight: 600; }
.src { display: flex; align-items: center; gap: .4em; font-size: .8em; font-weight: 700; color: var(--muted); margin: 0; }
.src svg { width: 1.1em; height: 1.1em; flex: none; }
.why { font-size: .92em; color: var(--muted); }
.why b { color: var(--ink); font-weight: 700; }
.clear { display: flex; align-items: center; gap: .5em; color: var(--ok-text); font-weight: 700; margin: 0; }
.clear svg { width: 1.2em; height: 1.2em; }
.strip { display: flex; flex-direction: column; gap: .45em; width: 100%; padding: .75em 1em; border-radius: 20px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--glass-hi), var(--glass-lo)); color: var(--ink); text-align: left; min-height: 56px; }
.strip .sbar { height: 8px; border-radius: 99px; background: var(--field); border: 1px solid var(--line); overflow: hidden; display: block; }
.strip .sbar i { display: block; height: 100%; background: var(--prim-grad); border-radius: inherit; transition: width 500ms cubic-bezier(.2, .8, .2, 1); }
.strip .stxt { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .2em .8em; font-size: .85em; }
.strip .stxt span { color: var(--gold); font-weight: 750; }
.btn.disc { justify-content: space-between; }
.btn.disc svg, .btn svg { width: 1.2em; height: 1.2em; flex: none; }
.sect-h { margin: .4em 0 0; font-size: .85em; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.morelist .btn .ihead { display: flex; align-items: center; gap: .55em; }
.morelist .btn .ihead svg { color: var(--corner); }
.btn.doc { flex-direction: column; align-items: flex-start; text-align: left; border-radius: 20px; padding: .8em 1.1em; gap: .2em; }
.btn.doc .ihead { display: flex; align-items: center; gap: .5em; }
.clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 650; }
.btn .hint { display: block; }

/* ============ support ============ */
.supcard { gap: .75em; border-color: var(--care); }
.visual { margin: -.35em -.4em 0; border-radius: 18px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--field); position: relative; }
.visual img, .visual .scene { width: 100%; height: 100%; object-fit: cover; display: block; }
.visual figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: .6em .8em; background: linear-gradient(transparent, rgba(0, 0, 0, .6)); color: #fff; font-weight: 650; font-size: .9em; }
.scene .sun { animation: sunrise 9s ease-in-out infinite alternate; }
@keyframes sunrise { from { transform: translateY(8px); } to { transform: translateY(-6px); } }
.scene .wave { animation: wave 7s ease-in-out infinite alternate; }
.scene .w2 { animation-duration: 9s; } .scene .w3 { animation-duration: 11s; }
@keyframes wave { from { transform: translateX(0); } to { transform: translateX(-60px); } }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45em; }
.choices .chip { padding: .45em .5em; line-height: 1.2; font-size: .92em; }
@media (max-width: 400px) { .choices { grid-template-columns: 1fr; } }
.breath.cycle { width: min(56vw, 210px); }
.breath.cycle::after { animation: none; display: none; }
.breath.cycle .fill { animation: breathcycle 10s ease-in-out infinite; animation-delay: var(--bdelay, 0s); }
@keyframes breathcycle { 0% { transform: scale(.4); opacity: .7; } 40% { transform: scale(1); opacity: 1; } 100% { transform: scale(.4); opacity: .7; } }
.breath .cue { position: relative; font-size: 1.6em; font-weight: 800; }
.btn.opt { justify-content: flex-start; text-align: left; }
.onestep { border-color: var(--care); }
.checkin { gap: .55em; }
.crisis a { color: var(--ink); font-weight: 750; }

/* ============ progress ============ */
.lvl { gap: .55em; border-color: var(--gold); background: linear-gradient(180deg, var(--gold-soft), var(--glass-lo)); }
.lvl .lbl { display: flex; align-items: center; gap: .4em; color: var(--gold); }
.lvl .lbl svg { width: 1.1em; height: 1.1em; }
.lvl .big { font-size: 2.2em; }
.quest { display: flex; align-items: center; gap: .55em; padding: .6em .8em; border-radius: 14px; border: 1px dashed var(--line); font-weight: 650; font-size: .92em; }
.quest svg { width: 1.2em; height: 1.2em; flex: none; color: var(--gold); }
.quest.done { border-style: solid; border-color: var(--ok-text); }
.quest.done svg { color: var(--ok-text); }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; }
.stat { padding: .8em .9em; border-radius: 20px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--glass-hi), var(--glass-lo)); display: flex; flex-direction: column; gap: .1em; }
.stat b { font-size: 1.6em; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat span { font-size: .8em; color: var(--muted); font-weight: 650; }
.mlist { list-style: none; padding: 0; gap: .45em; }
.mlist li { display: flex; align-items: center; gap: .55em; flex-wrap: wrap; }
.mlist li svg { width: 1.2em; height: 1.2em; flex: none; }
.mlist li.got svg { color: var(--gold); }
.mlist li.next { color: var(--muted); }
.mlist li .small { margin-left: auto; }
#miles h2 { margin: 0; }

/* ============ library and reminders ============ */
.passage { display: flex; flex-direction: column; gap: .5em; padding: .85em 1em; border-radius: 18px; border: 1px solid var(--line); border-left: 3px solid var(--line); background: linear-gradient(180deg, var(--glass-hi), var(--glass-lo)); }
.passage.on { border-left-color: var(--ok-text); }
.passage .row { justify-content: space-between; }
.passage .row .btn { width: auto; flex: none; }
.pager { display: grid; grid-template-columns: 1fr auto 1fr; gap: .5em; align-items: center; }
.pager .lbl { text-align: center; margin: 0; }
.derived { gap: .45em; }
.derived.mine { border-color: var(--corner); }
.derived .btn.link { align-self: flex-start; }
.citem .thumb { width: 100%; max-height: 260px; object-fit: cover; border-radius: 16px; display: block; }
.seg.two { grid-template-columns: 1fr 1fr; }
input[type=search], input[type=number] { width: 100%; min-width: 0; min-height: 48px; border: 1px solid var(--line); background: var(--field); border-radius: 16px; padding: .65em .9em; }

/* ============ celebration: on top, never in the way ============ */
.celebrate { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 14px); z-index: 50; display: flex; justify-content: center; pointer-events: none; animation: celin 380ms cubic-bezier(.2, .9, .3, 1.3) both; }
.celebrate.out { animation: celout 450ms ease forwards; }
.cbadge { display: flex; flex-direction: column; align-items: center; gap: .15em; padding: .8em 1.4em; border-radius: 22px; background: var(--glass-solid); border: 1px solid var(--gold); box-shadow: 0 16px 40px var(--shadow), 0 0 0 4px var(--gold-soft); text-align: center; max-width: calc(100% - 32px); }
.cbadge svg { width: 30px; height: 30px; color: var(--gold); }
.cbadge b { font-size: 1.05em; }
.cbadge span { font-size: .8em; color: var(--muted); font-weight: 650; }
.confetti { position: absolute; top: 40px; left: 50%; width: 0; height: 0; }
.confetti i { position: absolute; width: 8px; height: 12px; border-radius: 2px; background: var(--c); opacity: 0; animation: conf 1.4s cubic-bezier(.2, .7, .4, 1) var(--d) forwards; }
@keyframes conf { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--x), 160px) rotate(var(--r)); } }
@keyframes celin { from { opacity: 0; transform: translateY(-14px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes celout { to { opacity: 0; transform: translateY(-10px); } }
.toast { z-index: 70; display: flex; align-items: center; gap: .8em; width: max-content; max-width: min(calc(100% - 32px), 500px); }
.toast span { flex: 1; min-width: 0; }
.toast button { flex: none; min-height: 44px; min-width: 44px; padding: 0 .4em; border: 0; background: none; color: inherit; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
.trow.pop { animation: rowdone 520ms ease; }
@keyframes rowdone { 0% { box-shadow: 0 0 0 0 var(--corner-glow); } 50% { box-shadow: 0 0 0 6px var(--corner-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* very large Text Size: padding and icons stop growing, long words wrap instead of pushing past the edge */
.card { padding: min(1.15em, 20px) min(1.2em, 20px); }
.btn { overflow-wrap: anywhere; min-width: 0; padding-left: min(1.1em, 18px); padding-right: min(1.1em, 18px); }
.row > .btn, .row > a.btn { min-width: 0; }
.sect { flex-wrap: wrap; }
.btn svg, .btn.disc svg { width: min(1.2em, 26px); height: min(1.2em, 26px); }
.chip, .fchip { overflow-wrap: anywhere; max-width: 100%; }
#screen { overflow-wrap: anywhere; }
#screen .btn.link { overflow-wrap: break-word; flex: 0 1 auto; }

/* ============ v7: tiles, sheet, wheels, deck; smoother motion ============ */
:root { --ease: cubic-bezier(.22, 1, .36, 1); --ease-ios: cubic-bezier(.32, .72, 0, 1); }
#screen.enter { animation: screenin2 420ms var(--ease-ios) both; }
@keyframes screenin2 { from { opacity: 0; transform: translateY(14px) scale(.992); } to { opacity: 1; transform: none; } }
.btn, .chip, .tile2, .tbtn, .ckchip, .booktile, .ract, .donechip { transition: transform 260ms var(--ease), background 200ms var(--ease), border-color 200ms var(--ease), box-shadow 260ms var(--ease); }
.btn:active:not(:disabled), .chip:active, .tile2:active, .tbtn:active, .ckchip:active, .booktile:active, .ract:active, .donechip:active { transform: scale(.965); }
.tbar { display: flex; gap: .3em; flex-wrap: wrap; justify-content: flex-end; }
.tbtn { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; gap: .3em; padding: 0 .7em; border-radius: 99px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font-weight: 700; font-size: .8em; }
.tbtn svg { width: 16px; height: 16px; }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tbtn:disabled { opacity: .4; }
/* tiles grouped by time of day */
.part { display: flex; flex-direction: column; gap: .45em; }
.parth { margin: .3em 0 0; font-size: .8em; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: .5em; }
.parth .n { font-size: .9em; padding: .05em .55em; border-radius: 99px; background: var(--field); border: 1px solid var(--line); color: var(--ink); letter-spacing: 0; }
.part-overdue .parth { color: var(--bad-text); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5em; }
.tile2 { position: relative; display: flex; align-items: flex-start; gap: .45em; padding: .55em .55em .55em .5em; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--glass-hi), var(--glass-lo)); min-height: 64px; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.tile2 .check { width: 36px; height: 36px; flex: none; }
.tile2 .check svg { width: 18px; height: 18px; }
.tile2 .tbody { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); text-align: left; padding: .2em 0; min-height: 44px; display: flex; flex-direction: column; gap: .2em; }
.tile2 .ttitle { font-weight: 700; font-size: .95em; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile2 .tmeta { font-size: .76em; color: var(--muted); display: flex; align-items: center; gap: .35em; }
.pdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.pdot.p-urgent { background: var(--bad-text); } .pdot.p-high { background: var(--warn-text); }
.tile2.pr-urgent { border-color: var(--signal-line); }
.tile2.picked { border-color: var(--corner); box-shadow: 0 0 0 2px var(--corner-soft); }
.tile2.lifted { transform: scale(1.03); box-shadow: 0 12px 26px var(--shadow); }

.donewrap { display: flex; flex-wrap: wrap; gap: .4em; }

/* the sheet */
.sheetwrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }

.sheet { position: relative; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain; padding: .5em 1em calc(1.2em + env(safe-area-inset-bottom, 0px)); border-radius: 26px 26px 0 0;
  background: var(--glass-solid); border: 1px solid var(--line); box-shadow: 0 -18px 50px var(--shadow); display: flex; flex-direction: column; gap: .7em; animation: sheetup 420ms var(--ease-ios) both; }

/* urgency slider */

  border-radius: 99px; border: 1px solid var(--line); background: var(--glass-solid); color: var(--ink); box-shadow: 0 12px 30px var(--shadow); max-width: 70vw; animation: sheetup 420ms var(--ease-ios) both; }

  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.5px)); animation: mfpulse 2.4s ease-in-out infinite; }

/* the deck */

.spark { flex: none; width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--field); color: var(--ty-custom); display: grid; place-items: center; padding: 0; }

.check.pick { border-radius: 12px; }

  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.5px)); }

  background: radial-gradient(circle at 50% 36%, var(--orb-shine), transparent 32%), radial-gradient(circle, var(--orb-1), var(--orb-2) 55%, var(--orb-3) 72%); box-shadow: 0 0 70px var(--orb-halo), inset 0 0 40px var(--orb-halo); }

  background: var(--prim-grad); color: var(--prim-ink); font-weight: 800; box-shadow: 0 10px 30px var(--shadow); }

/* one Back button, always at the top of inner screens */

  padding: .3em .95em .3em .6em; margin: -.6em 0 -.5em -.2em; border-radius: 99px; border: 1px solid var(--line); background: var(--glass-solid); color: var(--ink); font-weight: 700; box-shadow: 0 6px 18px var(--shadow);

/* reader: passages are toggles */

.selbar { position: fixed; z-index: 28; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 8px);
  max-width: 516px; margin: 0 auto; display: flex; flex-direction: column; gap: .5em; padding: .8em .9em; border-radius: 22px; border: 1px solid var(--corner); background: var(--glass-solid); box-shadow: 0 12px 34px var(--shadow); }

/* ---- v10: glass refresh, reader, shelf, check-in bands, companion ---- */
html { background: var(--bg); }
body { background: transparent; }
/* a slow aurora behind everything; only transform moves, so it stays cheap */
body::before { content: ""; position: fixed; inset: -25%; z-index: -1; pointer-events: none;
  background: radial-gradient(38% 32% at 22% 22%, var(--glow-a), transparent 70%), radial-gradient(34% 30% at 80% 18%, var(--glow-c), transparent 70%), radial-gradient(42% 34% at 58% 86%, var(--glow-b), transparent 70%), radial-gradient(30% 26% at 12% 78%, var(--glow-c), transparent 70%);
  animation: aurora 48s ease-in-out infinite alternate; will-change: transform; }
@keyframes aurora { 0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); } 50% { transform: translate3d(4%, -3%, 0) rotate(7deg) scale(1.08); } 100% { transform: translate3d(-3%, 4%, 0) rotate(-5deg) scale(1.04); } }

/* blur only on the few surfaces that float over content: the dock, toasts, sheets, the reading bar */

.btn, .chip, .ctile, .book, button.card, .react, .ckchip, .cntbtn { transition: transform 200ms var(--ease-ios, cubic-bezier(.32, .72, 0, 1)), filter 160ms ease, border-color 200ms ease, background-color 200ms ease; }

/* the reader: just you and the page */

  display: flex; align-items: center; justify-content: space-between; gap: .3em; padding: .35em .45em; border-radius: 99px; background: rgba(14, 16, 24, .74); border: 1px solid var(--line);
