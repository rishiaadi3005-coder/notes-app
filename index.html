<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ten Days</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ten Days">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#141C18">
<style>
:root {
  --bg: #F1F3F0; --surface: #FFFFFF; --ink: #141C18; --muted: #545F59; --line: #DAE0DA;
  --corner: #0E6B58; --corner-soft: #E0EFE9; --signal: #D4452A; --signal-ink: #FFFFFF; --signal-soft: #FBE6E0;
  --warn: #8A5E0F; --warn-soft: #F6ECD8;
  --bar: 104px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0E1412; --surface: #17201C; --ink: #E7ECE8; --muted: #A3AEA8; --line: #27312C;
    --corner: #43B89C; --corner-soft: #173129; --signal: #EE6441; --signal-ink: #1A0E0A; --signal-soft: #3A1C14;
    --warn: #D9A64A; --warn-soft: #352A15; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
/* Body text follows the iPhone Text Size setting through -apple-system-body; everything else is sized in em from it. */
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px; line-height: 1.45; }
@supports (font: -apple-system-body) { body { font: -apple-system-body; line-height: 1.45; } }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--corner); outline-offset: 2px; }
[hidden] { display: none !important; }

.screen { max-width: 540px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 1em;
  padding-top: calc(1.2em + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 1em); }
h1 { font-size: 1.6em; line-height: 1.15; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1:focus { outline: none; }
p { margin: 0; }
.sub { color: var(--muted); }
.small { font-size: .85em; color: var(--muted); }
.lbl { font-size: .85em; font-weight: 600; color: var(--muted); }
.push { margin-top: auto; }
.group { display: flex; flex-direction: column; gap: .75em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1em; display: flex; flex-direction: column; gap: .75em; min-width: 0; }
.card.warn { background: var(--warn-soft); border-color: var(--warn); }
.card.bad { background: var(--signal-soft); border-color: var(--signal); }
.card.ok { background: var(--corner-soft); border-color: var(--corner); }
.status { font-weight: 600; }
.status.ok { color: var(--corner); }
.status.bad { color: var(--signal); }

.btn { min-height: 48px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: .6em 1em; border-radius: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; text-align: center; width: 100%; }
.btn.primary { min-height: 56px; background: var(--ink); color: var(--bg); border-color: var(--ink); font-size: 1.05em; }
.btn.corner { min-height: 56px; background: var(--corner); color: #fff; border-color: var(--corner); font-size: 1.05em; }
.btn.danger { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }
.btn.link { background: none; border: 0; text-decoration: underline; min-height: 44px; width: auto; align-self: center; }
.btn:disabled { opacity: .45; cursor: default; }
.btn .hint { display: block; font-weight: 400; font-size: .85em; color: var(--muted); }
.morelist .btn { justify-content: space-between; text-align: left; flex-direction: column; align-items: flex-start; }
.row { display: flex; gap: .5em; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1; width: auto; }
.chip { min-height: 48px; border: 1px solid var(--line); background: transparent; padding: .4em 1em; border-radius: 99px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.field { display: flex; flex-direction: column; gap: .3em; min-width: 0; }
input[type=text], input[type=tel], textarea { width: 100%; min-width: 0; min-height: 48px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: .6em .8em; }
.toggle { display: flex; gap: .75em; align-items: flex-start; min-height: 48px; }
.toggle input { width: 26px; height: 26px; margin-top: .1em; accent-color: var(--corner); flex: none; }
code { font: .85em ui-monospace, Menlo, Consolas, monospace; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .6em .8em; word-break: break-all; display: block; -webkit-user-select: all; user-select: all; }
ol, ul { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: .5em; }

.breath { align-self: center; position: relative; width: min(70vw, 260px); aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--corner); display: grid; place-items: center; overflow: hidden; }
.breath .fill { position: absolute; inset: 0; border-radius: 50%; background: var(--corner-soft); transform: scale(0); animation: breathfill 10s linear forwards; }
.breath .count { position: relative; font-size: 3em; font-weight: 800; font-variant-numeric: tabular-nums; }
@keyframes breathfill { from { transform: scale(0); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .breath .fill { animation: none; transform: scale(1); } }

.logrow { display: flex; flex-direction: column; gap: .4em; padding: .8em 0; border-bottom: 1px solid var(--line); }
.logrow:last-child { border-bottom: 0; }

/* fixed SOS bar, above the home indicator */
.sosbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sosbar > * { max-width: 540px; margin: 0 auto; }
.sos { width: 100%; min-height: 72px; border: 0; border-radius: 18px; background: var(--signal); color: var(--signal-ink); font-size: 1.5em; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.cancelbar { display: flex; gap: .75em; align-items: center; min-height: 72px; background: var(--signal-soft); border: 2px solid var(--signal); border-radius: 18px; padding: .5em .75em; }
.cancelbar b { flex: 1; font-size: 1.15em; }
.cancelbar .btn { width: auto; min-width: 110px; min-height: 56px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 8px); z-index: 40;
  background: var(--ink); color: var(--bg); padding: .6em 1em; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<main class="screen" id="screen"></main>

<div class="sosbar" id="sosbar">
  <button class="sos" id="sos" type="button" aria-label="I need you. Sends a check-in.">I need you</button>
  <div class="cancelbar" id="cancelbar" hidden role="status">
    <b id="cd-text">Sending in 3…</b>
    <button class="btn danger" id="cd-cancel" type="button">Cancel</button>
  </div>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  // ============ constants (no topic names, numbers or secrets live in this file) ============
  var KEY = "tendays.v1";
  var NTFY = "https://ntfy.sh/";
  var TOPIC_RE = /^[A-Za-z0-9_-]{8,60}$/;
  var CANCEL_S = 3, BREATH_MS = 10000, SEND_TIMEOUT = 10000, NIGHT_MS = 6 * 3600e3;
  var DEFAULT_LABELS = ["I'm here", "Phone out", "I'm calling you"];
  var GOALS = [["recovery", "Recovery"], ["reading", "Reading"], ["fitness", "Fitness"], ["devotional", "Devotional"], ["family", "Family"], ["health", "Health admin"]];

  // ============ helpers ============
  function $(id) { return document.getElementById(id); }
  function h(tag, props) {
    var e = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "value" || k === "checked" || k === "disabled") e[k] = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : String(v));
    }
    (function add(list) {
      list.forEach(function (c) {
        if (c == null || c === false) return;
        if (Array.isArray(c)) return add(c);
        e.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
      });
    })(Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function obj(x) { return x && typeof x === "object" && !Array.isArray(x) ? x : null; }
  function str(x, max) { return typeof x === "string" ? x.slice(0, max || 200) : ""; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function cleanPhone(p) { return (p || "").replace(/[^\d+]/g, ""); }
  function fmtTime(ms) { return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  function fmtDate(ms) { return new Date(ms).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }); }
  function randomTopic(prefix) {
    var a = "abcdefghijkmnpqrstuvwxyz23456789", out = prefix, bytes = new Uint8Array(20);
    crypto.getRandomValues(bytes);
    for (var i = 0; i < bytes.length; i++) out += a[bytes[i] % a.length];
    return out;
  }
  function isStandalone() {
    var dm = false;
    try { dm = !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches); } catch (e) {}
    return dm || window.navigator.standalone === true;
  }
  var toastT;
  function toast(m, ms) { var t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, ms || (m.length > 60 ? 5000 : 3000)); }
  function isQuota(e) { return e && (e.name === "QuotaExceededError" || e.code === 22); }
  function copyText(text, el) {
    var fb = function () { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Tap Copy in the menu."); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast("Copied."); }, fb); else fb();
  }
  function confirmBtn(label, armedLabel, onConfirm) {
    var armed = false, t = 0, b = h("button", { class: "btn", type: "button", text: label });
    b.addEventListener("click", function () {
      if (armed) { clearTimeout(t); armed = false; onConfirm(); return; }
      armed = true; b.textContent = armedLabel; b.classList.add("danger");
      t = setTimeout(function () { armed = false; b.textContent = label; b.classList.remove("danger"); }, 4000);
    });
    return b;
  }

  // ============ storage (unknown fields from later stages are kept as they are) ============
  function migrate(r) {
    var s = obj(r) || {};
    s.v = 4;
    s.topics = obj(s.topics) || {};
    ["alert", "reminders", "replies"].forEach(function (k) { if (!TOPIC_RE.test(s.topics[k] || "")) delete s.topics[k]; });
    if (!s.topics.alert && TOPIC_RE.test(s.topic || "")) s.topics.alert = s.topic;
    if (!s.topics.reminders && TOPIC_RE.test(s.remTopic || "")) s.topics.reminders = s.remTopic;
    delete s.topic; delete s.remTopic;
    s.phone = str(s.phone, 40); s.self = str(s.self, 40); s.name = str(s.name, 40);
    s.namedAlerts = !!s.namedAlerts; s.noteOn = !!s.noteOn; s.noteText = str(s.noteText, 80);
    var L = Array.isArray(s.labels) ? s.labels : [];
    s.labels = [0, 1, 2].map(function (i) { var x = str(L[i], 24).trim(); return x || DEFAULT_LABELS[i]; });
    s.goals = Array.isArray(s.goals) && s.goals.length ? s.goals.filter(function (g) { return GOALS.some(function (x) { return x[0] === g; }); }) : ["recovery"];
    s.ob = obj(s.ob) || { done: false };
    s.alertTestedAt = +s.alertTestedAt || +s.testedAt || 0; delete s.testedAt;
    s.myTestedAt = +s.myTestedAt || +s.remTestedAt || 0; delete s.remTestedAt;
    s.nightTestedAt = +s.nightTestedAt || 0;
    if (!Array.isArray(s.log)) s.log = Array.isArray(s.presses) ? s.presses.filter(function (t) { return typeof t === "number"; }).map(function (t) { return { at: t, sent: true, line: "" }; }) : [];
    s.log = s.log.filter(function (e) { return obj(e) && typeof e.at === "number"; }).map(function (e) { var o = { at: e.at, sent: e.sent === true ? true : e.sent === false ? false : null, again: !!e.again, line: str(e.line, 140) }; if (e.untested) o.untested = true; return o; });
    delete s.presses; delete s.round;
    s.lastSOS = obj(s.lastSOS); s.lastReply = obj(s.lastReply);
    s.breathEnd = +s.breathEnd || 0;
    return s;
  }
  function load() { var raw = null; try { raw = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { raw = null; } return migrate(raw); }
  var S = load();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
    catch (e) { toast(isQuota(e) ? "This phone is out of storage for Ten Days, so that wasn't saved." : "That wasn't saved on this phone.", 6000); return false; }
  }
  save();

  // Topics are made only inside the home-screen app, never in Safari.
  function ensureTopics() {
    if (!isStandalone()) return false;
    var t = S.topics, changed = false;
    if (!t.alert) { t.alert = randomTopic("td-"); changed = true; }
    if (!t.replies) { t.replies = randomTopic("tp-"); changed = true; }
    if (!t.reminders) { t.reminders = randomTopic("tr-"); changed = true; }
    if (changed) save();
    return true;
  }

  // ============ ntfy ============
  function ntfy(topic, params, body) {
    if (!navigator.onLine) return Promise.resolve({ ok: false, why: "offline" });
    var q = Object.keys(params).filter(function (k) { return params[k] !== undefined && params[k] !== ""; })
      .map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&");
    var ctrl = typeof AbortController === "function" ? new AbortController() : null, timedOut = false;
    var timer = setTimeout(function () { timedOut = true; if (ctrl) ctrl.abort(); }, SEND_TIMEOUT);
    var p = fetch(NTFY + encodeURIComponent(topic) + (q ? "?" + q : ""), { method: "POST", body: body || "", signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { clearTimeout(timer); return { ok: r.ok && !timedOut, why: r.ok ? "" : r.status === 429 ? "ratelimit" : "error" }; })
      .catch(function () { clearTimeout(timer); return { ok: false, why: timedOut ? "timeout" : "error" }; });
    var stop = new Promise(function (res) { setTimeout(function () { res({ ok: false, why: "timeout" }); }, SEND_TIMEOUT + 300); });
    return Promise.race([p, stop]);
  }
  function quoteVal(s) { return '"' + String(s).replace(/"/g, "") + '"'; }
  // His three buttons. Each posts its own words to the REPLIES topic, and nothing else.
  function replyActions() {
    return S.labels.map(function (l) {
      return "http, " + quoteVal(l) + ", " + NTFY + S.topics.replies + ", method=POST, body=" + quoteVal(l) + ", clear=true";
    }).join("; ");
  }
  function alertParams(title, priority) {
    var p = { title: title, priority: String(priority || 5), tags: "rotating_light" };
    if (S.topics.replies) p.actions = replyActions();
    var me = cleanPhone(S.self); if (me) p.click = "tel:" + me;
    return p;
  }
  function sosText(again) {
    var base = again ? "Check in again" : "Check in";
    var title = S.namedAlerts && S.name ? S.name + ": " + base.toLowerCase() : base;
    var body = again ? "Please call." : "Call when you can.";
    if (S.noteOn && S.noteText.trim()) body += " " + S.noteText.trim();
    return { title: title, body: body };
  }
  function whyText(why) { return { offline: "You're offline.", timeout: "No answer from ntfy in 10 seconds.", ratelimit: "ntfy is rate-limiting. Call him.", error: "ntfy didn't accept it." }[why] || ""; }

  // ============ replies (his buttons) ============
  var awaitingTest = null; // { kind: "alert"|"night", since }
  function pollReplies() {
    if (!S.topics.replies || !navigator.onLine) return Promise.resolve();
    var since = Math.max(S.lastReply ? S.lastReply.at : 0, Date.now() - 24 * 3600e3);
    return fetch(NTFY + encodeURIComponent(S.topics.replies) + "/json?poll=1&since=" + Math.floor(since / 1000))
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (t) {
        var best = null;
        t.split("\n").forEach(function (line) {
          if (!line.trim()) return;
          try { var m = JSON.parse(line); if (m.event === "message" && typeof m.time === "number") { var at = m.time * 1000; if (!best || at > best.at) best = { at: at, text: str(m.message, 80) }; } } catch (e) {}
        });
        if (best && (!S.lastReply || best.at > S.lastReply.at)) {
          S.lastReply = best; save();
          toast("He replied: " + best.text);
          if (awaitingTest && best.at >= awaitingTest.since - 2000) markTested(awaitingTest.kind);
          render(false);
        }
      }).catch(function () {});
  }
  var pollT = null, fastUntil = 0;
  function startFast() { fastUntil = Date.now() + 120e3; }   // fast polling lasts 2 minutes
  function schedulePoll() {
    clearTimeout(pollT);
    if (awaitingTest && Date.now() >= fastUntil) awaitingTest = null;
    var fast = (ui.screen === "breath" || !!awaitingTest) && Date.now() < fastUntil;
    pollT = setTimeout(function () { if (!document.hidden) pollReplies().then(schedulePoll); else schedulePoll(); }, fast ? 5000 : 15000);
  }
  function markTested(kind) {
    if (kind === "alert") S.alertTestedAt = Date.now();
    if (kind === "night") S.nightTestedAt = Date.now();
    if (kind === "mine") S.myTestedAt = Date.now();
    awaitingTest = null; testState = { kind: kind, status: "confirmed" }; save(); render(false);
  }

  // ============ wake lock (not relied on) ============
  var wake = null;
  function holdAwake() { try { if (navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(function (w) { wake = w; w.addEventListener("release", function () { wake = null; }); }).catch(function () {}); } catch (e) {} }
  function releaseAwake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }

  // ============ SOS ============
  var cdT = null, cdStart = 0;
  function onSOS() {
    if (cdT) return;
    if (!S.topics.alert) { go("notsetup"); return; }   // not logged: setup isn't done
    holdAwake();
    cdStart = Date.now();
    var left = CANCEL_S;
    $("sos").hidden = true; $("cancelbar").hidden = false; $("cd-text").textContent = "Sending in " + left + "…";
    $("cd-cancel").focus();
    cdT = setInterval(function () {
      left--;
      if (left <= 0) { stopCountdown(); sendSOS(); }
      else $("cd-text").textContent = "Sending in " + left + "…";
    }, 1000);
  }
  function stopCountdown() { clearInterval(cdT); cdT = null; $("cancelbar").hidden = true; $("sos").hidden = false; }
  function cancelSOS() { if (Date.now() - cdStart < 700) return; stopCountdown(); releaseAwake(); toast("Cancelled. Nothing was sent."); }
  function sendSOS() {
    var now = Date.now();
    var again = S.log.some(function (e) { return e.at > now - NIGHT_MS && !e.untested && (e.sent === true || e.sent === null); });
    var entry = { at: now, sent: null, again: again, line: "" };
    if (S.alertTestedAt === 0) entry.untested = true;
    S.log.push(entry);
    S.lastSOS = { at: now, status: "sending", why: "", again: again };
    if (!(S.breathEnd > now)) S.breathEnd = now + BREATH_MS;   // a second press keeps the breath going
    save();
    if (ui.screen !== "breath") go("breath"); else render(false);
    postSOS(now);
  }
  function postSOS(at) {
    var entry = S.log.filter(function (e) { return e.at === at; })[0];
    if (!entry) return;
    S.lastSOS = { at: at, status: "sending", why: "", again: entry.again }; save(); render(false);
    holdAwake();
    var tx = sosText(entry.again);
    ntfy(S.topics.alert, alertParams(tx.title, 5), tx.body).then(function (r) {
      entry.sent = r.ok;
      if (S.lastSOS && S.lastSOS.at === at) { S.lastSOS.status = r.ok ? "sent" : "notsent"; S.lastSOS.why = r.why; }
      save(); releaseAwake(); render(false); startFast(); schedulePoll();
    });
  }
  function resend() { if (S.lastSOS) postSOS(S.lastSOS.at); }

  // ============ screens ============
  var ui = { screen: "home", arg: null, goalSel: null };
  var testState = null; // { kind, status: "sending"|"sent"|"notsent"|"confirmed"|"nothing", why }
  function go(name, arg) { ui.screen = name; ui.arg = arg || null; ui.goalSel = null; render(true); window.scrollTo(0, 0); }
  function back(to) { return h("button", { class: "btn link", type: "button", id: "back", onclick: function () { go(to || "more"); } }, "Back"); }
  function topicBox(label, value, id) {
    var c = h("code", { id: id, text: value || "Not made yet" });
    return h("div", { class: "field" }, h("span", { class: "lbl", text: label }), c,
      value ? h("button", { class: "btn", type: "button", id: id + "-copy", onclick: function () { copyText(value, c); } }, "Copy") : null);
  }
  var KEYS = ["alert", "replies", "reminders"], PREFIX = { alert: "td-", replies: "tp-", reminders: "tr-" };
  var RECOPY = "Re-copy your Back Tap URL.";
  function missingTopic() { return KEYS.some(function (k) { return !S.topics[k]; }); }
  function setTopic(key, value) {
    var others = KEYS.filter(function (k) { return k !== key; }).map(function (k) { return S.topics[k]; });
    if (!TOPIC_RE.test(value)) { toast("Use 8 to 60 letters, numbers, - or _."); return false; }
    if (others.indexOf(value) >= 0) { toast("Another channel already uses that name."); return false; }

        h("p", { text: "This makes your call ring on his phone even when it's silenced." }),
        h("p", { class: "lbl", text: "His iPhone" }),
        h("ol", null, h("li", { text: "Contacts → your name → Edit." }), h("li", { text: "Ringtone → turn on Emergency Bypass → Done." }), h("li", { text: "Do the same under Text Tone if he wants texts to break through too." })),
        h("p", { class: "lbl", text: "His Android" }),
        h("ol", null, h("li", { text: "Contacts → star your contact." }), h("li", { text: "Settings → Do Not Disturb → People → Calls → Starred contacts." })),
        h("p", { class: "small", text: "Confirm these screens on his phone's version, then test a call at night." }),
        h("div", { class: "group push" }, back())
      ] };
    },
    "m-log": function () {
      var list = S.log.slice().sort(function (a, b) { return b.at - a.at; });
      return { title: "Private log", body: [
        h("p", { text: "Only you see this, and nothing here is ever sent." }),
        list.length ? h("div", { class: "card", id: "log-list" }, list.map(function (e) {
          return h("div", { class: "logrow" },
            h("span", { class: "lbl", text: fmtDate(e.at) + ", " + fmtTime(e.at) + " · " + (e.sent === true ? (e.untested ? "Sent, not tested with him" : "Sent") : e.sent === false ? "Not sent" : "Sending") }),
            e.line ? h("span", { text: e.line }) : null,
            h("div", { class: "row" },
              e.line ? confirmBtn("Delete line", "Tap again to delete", function () { e.line = ""; save(); render(false); }) : null,
              confirmBtn("Delete entry", "Tap again to delete", function () { S.log = S.log.filter(function (x) { return x !== e; }); save(); render(false); })));
        })) : h("p", { class: "sub", text: "Nothing here." }),
        h("div", { class: "group push" }, back())
      ] };
    },
    "m-goals": function () {
      var sel = ui.goalSel || (ui.goalSel = S.goals.slice());
      return { title: "Goals", body: [
        h("p", { text: "These stay on this phone and shape your next steps in a later version." }),
        goalChips(sel),
        h("div", { class: "group push" }, h("button", { class: "btn primary", type: "button", id: "save-goals", onclick: function () { S.goals = sel.slice(); if (save()) toast("Saved."); } }, "Save"), back())
      ] };
    },
    "m-backup": function () {
      var file = h("input", { type: "file", id: "import-in", accept: "application/json,.json", hidden: true, onchange: function (e) {
        var f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
        var rd = new FileReader();
        rd.onload = function () { var d = null; try { d = JSON.parse(rd.result); } catch (err) {} if (!obj(d) || !(obj(d.topics) || Array.isArray(d.log) || typeof d.topic === "string" || typeof d.remTopic === "string" || Array.isArray(d.presses))) { toast("That isn't a Ten Days backup."); return; } go("import-confirm", d); };
        rd.onerror = function () { toast("Couldn't read that file."); };
        rd.readAsText(f);
      } });
      return { title: "Backup", body: [
        h("p", { text: "Export saves everything on this phone to one file, and Import puts it back." }),
        h("div", { class: "group push" },
          h("button", { class: "btn primary", type: "button", id: "export", onclick: function () { go("export-warn"); } }, "Export"),
          file, h("button", { class: "btn", type: "button", id: "import", onclick: function () { file.click(); } }, "Import"), back())
      ] };
    },
    "export-warn": function () {
      return { title: "Before you download", body: [
        h("p", { text: "This file contains your channel names, your private log, both phone numbers and his last reply, so keep it somewhere only you can open." }),
        h("div", { class: "group push" },
          h("button", { class: "btn primary", type: "button", id: "export-confirm", onclick: function () {
            var data = JSON.parse(JSON.stringify(S)); data.exportedAt = new Date().toISOString();
            var url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
            var d = new Date(), a = h("a", { href: url, download: "ten-days-" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + ".json", hidden: true });
            document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 5000);
            toast("Backup file made."); go("m-backup");
          } }, "Download"),
          h("button", { class: "btn link", type: "button", id: "export-cancel", onclick: function () { go("m-backup"); } }, "Cancel"))
      ] };
    },
    "import-confirm": function (d) {
      return { title: "Replace this phone's data?", body: [
        h("p", { text: "Everything on this phone is replaced with the backup" + (d && d.exportedAt ? " from " + fmtDate(Date.parse(d.exportedAt)) : "") + "." }),
        h("div", { class: "group push" },
          h("button", { class: "btn danger", type: "button", id: "import-replace", onclick: function () { S = migrate(d); S.ob.done = true; if (isStandalone()) ensureTopics(); if (save()) { toast("Restored."); go("home"); } } }, "Replace"),
          h("button", { class: "btn link", type: "button", id: "import-cancel", onclick: function () { go("m-backup"); } }, "Cancel"))
      ] };
    }
  };

  function render(moveFocus) {
    var fn = SCREENS[ui.screen] || SCREENS.home;
    var out = fn(ui.arg);
    var h1 = h("h1", { tabindex: "-1", text: out.title });
    var root = $("screen");
    var active = document.activeElement && document.activeElement.id && root.contains(document.activeElement) ? document.activeElement.id : null;
    var vals = {}, checks = {};
    Array.prototype.forEach.call(root.querySelectorAll("input[type=text],input[type=tel]"), function (i) { if (i.id) vals[i.id] = i.value; });
    Array.prototype.forEach.call(root.querySelectorAll("input[type=checkbox]"), function (i) { if (i.id) checks[i.id] = i.checked; });
    var nodes = [h1];
    (function flat(list) { list.forEach(function (n) { if (Array.isArray(n)) flat(n); else if (n) nodes.push(n); }); })(out.body);
    root.replaceChildren.apply(root, nodes);
    if (!moveFocus) {
      // keep what the person was typing across live refreshes
      Object.keys(vals).forEach(function (id) { var i = $(id); if (i) i.value = vals[id]; });
      Object.keys(checks).forEach(function (id) { var i = $(id); if (i) i.checked = checks[id]; });
      if (active && $(active)) $(active).focus();
    } else { try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); } }
    if (ui.screen === "breath") tickBreath();
  }
  var breathT = null;
  function tickBreath() {
    clearTimeout(breathT);
    if (ui.screen !== "breath") return;
    breathT = setTimeout(function () {
      var left = Math.max(0, S.breathEnd - Date.now());
      var c = $("breath-count"), b = $("continue");
      if (c) c.textContent = left > 0 ? String(Math.ceil(left / 1000)) : "✓";
      if (b) { b.disabled = left > 0; b.textContent = left > 0 ? "Continue in " + Math.ceil(left / 1000) + "s" : "Continue"; }
      if (left > 0) tickBreath();
    }, 250);
  }

  // ============ boot ============
  $("sos").addEventListener("click", onSOS);
  $("cd-cancel").addEventListener("click", cancelSOS);
  function measureBar() { document.documentElement.style.setProperty("--bar", $("sosbar").offsetHeight + "px"); }
  window.addEventListener("resize", measureBar);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { pollReplies(); render(false); } });
  window.addEventListener("online", function () { pollReplies(); });

  function start() {
    if (S.lastSOS && S.lastSOS.status === "sending") { S.lastSOS.status = "notsent"; S.lastSOS.why = "timeout"; var e = S.log.filter(function (x) { return x.at === S.lastSOS.at; })[0]; if (e && e.sent === null) e.sent = false; save(); }
    if (!S.ob.done) {
      if (!isStandalone()) return go("a2hs");
      ensureTopics();
      return go("ob-topics");
    }
    if (S.breathEnd > Date.now()) return go("breath");
    go("home");
  }
  if (location.hash) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
  measureBar();
  start();
  pollReplies();
  schedulePoll();
})();
</script>
</body>
</html>
